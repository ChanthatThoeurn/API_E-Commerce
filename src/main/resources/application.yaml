file:
  client-path: /file
  storage-location: /home/chanthat/file-upload/
  base-uri: http://localhost:${server.port}${file.client-path}

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${USERNAME}
    password: ${PASSWORD}
    url: ${URL}
  application:
    name: ite-ecomest
server:
  port: 9696

